<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="title" content="WaveForge">
<meta name="description" content="Audio-reactive WaveForge lighting with twelve original visual styles">
<meta name="publisher" content="WaveForge">
<meta name="version" content="1.0.0">
<meta property="style" label="Style" type="combobox" values="spectrum-cycle,gradient-spectrum,wave,ripple,fire,rain,vu-meter,aurora,galaxy,bass-reactor,ambient,static" default="spectrum-cycle">
<meta property="background" label="Background" type="color" default="#05070b">
<meta property="sensitivity" label="Sensitivity" type="number" min="0.1" max="4" step="0.1" default="1.2">
<meta property="decay" label="Decay" type="number" min="0" max="0.99" step="0.01" default="0.82">
<meta property="size" label="Size" type="number" min="0.25" max="3" step="0.05" default="1">
<meta property="peakHold" label="Peak Hold" type="number" min="0" max="60" step="1" default="12">
<meta property="gamma" label="Gamma" type="number" min="0.2" max="3" step="0.1" default="1">
<meta property="brightness" label="Brightness" type="number" min="0.05" max="1" step="0.05" default="0.9">
<meta property="speed" label="Speed" type="number" min="0" max="4" step="0.1" default="1">
<meta property="mirror" label="Mirror" type="boolean" default="false">
<meta property="direction" label="Direction" type="combobox" values="forward,reverse" default="forward">
<meta property="color1" label="Primary" type="color" default="#19d3c5">
<meta property="color2" label="Secondary" type="color" default="#ff4f79">
<meta property="color3" label="Accent" type="color" default="#ffd166">
<title>WaveForge</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="waveforge" width="320" height="200"></canvas>
<script>
(function () {
  'use strict'
  var canvas = document.getElementById('waveforge')
  var ctx = canvas.getContext('2d')
  var W = 320, H = 200, TAU = Math.PI * 2
  var STYLES = ['spectrum-cycle','gradient-spectrum','wave','ripple','fire','rain','vu-meter','aurora','galaxy','bass-reactor','ambient','static']
  var SECTIONS = ['intro','verse','pre-chorus','chorus','bridge','outro','breakdown','drop','solo']
  var settings = {
    style:'spectrum-cycle', background:'#05070b', sensitivity:1.2, decay:0.82, size:1,
    peakHold:12, gamma:1, brightness:0.9, speed:1, mirror:false, direction:'forward',
    color1:'#19d3c5', color2:'#ff4f79', color3:'#ffd166'
  }
  var smooth = new Array(64).fill(0), peaks = new Array(32).fill(0), holds = new Array(32).fill(0)
  var drops = [], sparks = [], playing = true, beat = 0, section = 'intro', frame = 0

  function globalValue(name, fallback) {
    try { return window[name] === undefined ? fallback : window[name] } catch (_) { return fallback }
  }
  function numberSetting(name, min, max) {
    var value = Number(globalValue(name, settings[name]))
    return Number.isFinite(value) ? Math.max(min, Math.min(max, value)) : settings[name]
  }
  function syncSettings() {
    var requestedStyle = String(globalValue('style', settings.style))
    if (STYLES.indexOf(requestedStyle) >= 0) settings.style = requestedStyle
    var requestedDirection = String(globalValue('direction', settings.direction))
    if (requestedDirection === 'forward' || requestedDirection === 'reverse') settings.direction = requestedDirection
    settings.background = validColor(globalValue('background', settings.background)) || settings.background
    settings.color1 = validColor(globalValue('color1', settings.color1)) || settings.color1
    settings.color2 = validColor(globalValue('color2', settings.color2)) || settings.color2
    settings.color3 = validColor(globalValue('color3', settings.color3)) || settings.color3
    settings.sensitivity = numberSetting('sensitivity', 0.1, 4)
    settings.decay = numberSetting('decay', 0, 0.99)
    settings.size = numberSetting('size', 0.25, 3)
    settings.peakHold = numberSetting('peakHold', 0, 60)
    settings.gamma = numberSetting('gamma', 0.2, 3)
    settings.brightness = numberSetting('brightness', 0.05, 1)
    settings.speed = numberSetting('speed', 0, 4)
    settings.mirror = globalValue('mirror', settings.mirror) === true || globalValue('mirror', settings.mirror) === 'true'
  }
  function validColor(value) { return /^#[0-9a-f]{6}$/i.test(String(value)) ? String(value) : null }
  function rgb(hex, alpha) {
    var clean = validColor(hex) || '#ffffff'
    return 'rgba(' + parseInt(clean.slice(1,3),16) + ',' + parseInt(clean.slice(3,5),16) + ',' + parseInt(clean.slice(5,7),16) + ',' + Math.max(0,Math.min(1,alpha)) + ')'
  }
  function audio() {
    var raw = [], level = 0, density = 0, width = 0
    try {
      if (window.engine && engine.audio) {
        raw = engine.audio.freq(200) || []
        level = Number(engine.audio.level) || 0
        density = Number(engine.audio.density) || 0
        width = Number(engine.audio.width) || 0
      }
    } catch (_) { raw = [] }
    if (!raw.length) {
      for (var i=0;i<64;i++) raw[i] = (Math.sin(frame*0.055+i*0.31)+1)*0.22 + (Math.sin(frame*0.021+i)*0.08+0.08)
      level = 0.35 + Math.sin(frame*0.04)*0.15; density = 0.5; width = 0.6
    }
    for (var j=0;j<64;j++) {
      var source = Number(raw[Math.floor(j * raw.length / 64)]) || 0
      if (source > 1) source /= 255
      source = Math.pow(Math.max(0, Math.min(1, source * settings.sensitivity)), settings.gamma)
      smooth[j] = Math.max(source, smooth[j] * settings.decay)
    }
    return { bins:smooth, level:Math.min(1,level*settings.sensitivity), density:density, width:width }
  }
  function clear() { ctx.fillStyle = settings.background; ctx.fillRect(0,0,W,H) }
  function barSpectrum(a, gradient) {
    var count=32, bw=W/count
    for(var i=0;i<count;i++){
      var n=settings.mirror?Math.abs(i-count/2)*2:i, value=a.bins[Math.min(63,Math.floor(n*64/count))]
      var height=Math.max(1,value*H*0.9), hue=(frame*settings.speed*2+i*9)%360
      ctx.fillStyle=gradient?rgb(i/count<0.5?settings.color1:settings.color2,settings.brightness):'hsla('+hue+',85%,55%,'+settings.brightness+')'
      ctx.fillRect(i*bw,H-height,bw-1,height)
      if(value>=peaks[i]){peaks[i]=value;holds[i]=settings.peakHold}else if(holds[i]>0)holds[i]--;else peaks[i]*=0.94
      ctx.fillStyle=rgb(settings.color3,0.9);ctx.fillRect(i*bw,H-peaks[i]*H*0.9-2,bw-1,2)
    }
  }
  function wave(a) {
    ctx.lineWidth=3*settings.size;ctx.strokeStyle=rgb(settings.color1,settings.brightness);ctx.beginPath()
    for(var x=0;x<W;x+=4){var i=Math.floor(x/W*63), y=H/2+Math.sin(x*0.04+(settings.direction==='reverse'?-1:1)*frame*0.05*settings.speed)*a.bins[i]*75; if(x)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.stroke()
    ctx.fillStyle=rgb(settings.color2,a.level*0.4);ctx.fillRect(0,H/2-2,W,4)
  }
  function ripple(a) {
    for(var i=0;i<7;i++){var radius=((frame*settings.speed*2+i*34)%220)*settings.size;ctx.strokeStyle=rgb(i%2?settings.color1:settings.color2,(1-radius/230)*settings.brightness);ctx.lineWidth=2+a.level*6;ctx.beginPath();ctx.arc(W/2,H/2,radius,0,TAU);ctx.stroke()}ctx.fillStyle=rgb(settings.color3,a.level);ctx.fillRect(W/2-2,H/2-2,4,4)
  }
  function fire(a) {
    for(var x=0;x<W;x+=5){var i=Math.floor(x/W*63),h=(15+a.bins[i]*150)*settings.size;ctx.fillStyle=rgb(x%10?settings.color2:settings.color3,0.35+settings.brightness*0.6);ctx.fillRect(x,H-h,5,h)}
  }
  function rain(a) {
    if(drops.length<70) drops.push({x:Math.random()*W,y:-10,v:2+Math.random()*6})
    ctx.fillStyle=rgb(settings.color1,settings.brightness)
    drops.forEach(function(d,i){d.y+=d.v*(0.5+settings.speed);ctx.fillRect(d.x,d.y,2,7+a.level*12);if(d.y>H)drops[i]={x:Math.random()*W,y:-10,v:2+Math.random()*6}})
  }
  function vu(a) {
    var value=Math.min(1,a.level+a.bins[3]*0.5),segments=24
    for(var i=0;i<segments;i++){ctx.fillStyle=i/segments<value?rgb(i>19?settings.color2:(i>14?settings.color3:settings.color1),settings.brightness):rgb(settings.color1,0.08);ctx.fillRect(18+i*12,H/2-28,9,56)}
  }
  function aurora(a) {
    for(var band=0;band<5;band++){ctx.fillStyle=rgb(band%2?settings.color1:settings.color2,0.16+band*0.05);for(var x=0;x<W;x+=4){var y=30+band*24+Math.sin(x*0.025+frame*0.025*settings.speed+band)*25*a.bins[(x+band*7)%64];ctx.fillRect(x,y,5,30+a.level*18)}}
  }
  function galaxy(a) {
    ctx.save();ctx.translate(W/2,H/2);ctx.rotate(frame*0.002*settings.speed);for(var i=0;i<90;i++){var arm=i%4,rad=(i*11)%145,ang=arm*TAU/4+rad*0.035;ctx.fillStyle=rgb(i%3?settings.color1:settings.color3,0.25+a.bins[i%64]*0.7);ctx.fillRect(Math.cos(ang)*rad,Math.sin(ang)*rad*0.58,2+a.level*3,2+a.level*3)}ctx.restore()
  }
  function bass(a) {
    var bass=(a.bins[0]+a.bins[1]+a.bins[2])/3, radius=(20+bass*75+beat*0.25)*settings.size;ctx.fillStyle=rgb(settings.color2,0.18+bass*0.5);ctx.fillRect(W/2-radius,H/2-radius,radius*2,radius*2);ctx.strokeStyle=rgb(settings.color3,settings.brightness);ctx.lineWidth=5;ctx.beginPath();ctx.arc(W/2,H/2,radius,0,TAU);ctx.stroke()
  }
  function ambient(a) {
    var bands=[settings.color1,settings.color2,settings.color3];for(var i=0;i<3;i++){ctx.fillStyle=rgb(bands[i],0.18+a.bins[i*14]*0.35);ctx.fillRect(i*W/3,0,W/3+1,H)}
  }
  function staticStyle(a) { ctx.fillStyle=rgb(settings.color1,settings.brightness*(0.5+a.level*0.5));ctx.fillRect(0,0,W,H) }
  function draw() {
    syncSettings();clear();var a=audio();if(!playing){ctx.fillStyle=rgb(settings.color1,0.08);ctx.fillRect(0,0,W,H)}else{
      if(settings.style==='spectrum-cycle')barSpectrum(a,false)
      else if(settings.style==='gradient-spectrum')barSpectrum(a,true)
      else if(settings.style==='wave')wave(a)
      else if(settings.style==='ripple')ripple(a)
      else if(settings.style==='fire')fire(a)
      else if(settings.style==='rain')rain(a)
      else if(settings.style==='vu-meter')vu(a)
      else if(settings.style==='aurora')aurora(a)
      else if(settings.style==='galaxy')galaxy(a)
      else if(settings.style==='bass-reactor')bass(a)
      else if(settings.style==='ambient')ambient(a)
      else staticStyle(a)
    }beat*=0.88;frame++;requestAnimationFrame(draw)
  }
  window.onCanvasApiEvent = function (input) {
    var value=input
    if(input&&typeof input==='object'){
      if(String(input.sender||'').toLowerCase()!=='waveforge')return false
      value=input.event
    }
    if(typeof value!=='string'||value.length>96)return false
    if(value==='play'){playing=true;return true}if(value==='pause'||value==='stop'){playing=false;return true}if(value==='accent'||value.indexOf('accent:')===0){var av=value.indexOf(':')>0?Number(value.split(':')[1]):100;if(av>=0&&av<=100){beat=av;return true}return false}
    var match=/^beat:(\d{1,3})$/.exec(value);if(match){var amount=Number(match[1]);if(amount<=100){beat=amount;return true}return false}
    match=/^theme:([0-9a-f]{6}):([0-9a-f]{6})$/i.exec(value);if(match){settings.color1='#'+match[1];settings.color2='#'+match[2];return true}
    match=/^style:([a-z-]+)$/.exec(value);if(match&&STYLES.indexOf(match[1])>=0){settings.style=match[1];return true}
    match=/^section:([a-z-]+)$/.exec(value);if(match&&SECTIONS.indexOf(match[1])>=0){section=match[1];if(section==='chorus'||section==='drop')beat=100;return true}
    return false
  }
  window.__waveforgeEffect = { styles:STYLES.slice(), sections:SECTIONS.slice(), settings:settings, draw:draw }
  requestAnimationFrame(draw)
}())
</script>
</body>
</html>
