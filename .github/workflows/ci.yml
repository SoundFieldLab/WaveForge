# CI 检查：每次 push 代码，GitHub 自动帮你跑「类型检查 + 单测 + 构建」。
# 任何一步红了，提交旁边就会出现红叉；全绿说明 master 在（至少）Web 端和类型层面是能跑的。
#
# 触发时机：
#   push（任何分支）       -> 快速检查（几秒钟 ~ 1 分钟，便宜）
#   push master           -> 额外构建 Android TV APK（证明 TV 端没被合并搞炸）
#   打 tag（v*）           -> 额外构建 Windows 安装包（出包自动化，release.yml 负责发布）
#   手动触发（Actions 页面点 "Run workflow"）-> 随时可以强制跑所有构建
#
# 各平台构建命令都在 package.json 里（npm run build:electron / build:android），
# CI 只是把这些命令挂到 GitHub 上自动执行，机器装好对应工具链（Android SDK 等）即可。

name: CI 检查

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 快速检查：类型 + 单测 + 前端构建 ----------
  checks:
    name: 快速检查（类型/单测/构建）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 守卫检查（第一方源码不得被忽略/漏提交，无需依赖）
        run: npm run check:git

      - name: 安装依赖
        run: npm ci

      - name: 生成赞助商数据（prebuild 钩子，生成产物不入库）
        run: npm run prebuild

      - name: 类型检查（tsc --noEmit）
        run: npm run lint

      - name: 运行单测（vitest）
        run: npm run test

      - name: 运行 RGB、桌面安全与 stem Node 集成测试
        run: npm run test:chroma && npm run test:signalrgb && npm run test:desktop && npm run test:stems:node

      - name: 前端构建（vite build）
        run: npm run build

  # ---------- Android TV APK 构建（master push / 手动触发） ----------
  android-build:
    name: Android TV APK 构建
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确保 Gradle Wrapper 可执行
        run: chmod +x android/gradlew

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 拉取 nodejs-mobile 运行时
        run: npm run fetch:nodejs-mobile

      - name: 组装安卓资产（前端 + 后端 bundle + 设备端依赖）
        run: npm run build:android

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android 的 packages 默认值是 'tools platform-tools'，但 legacy 的 tools 包已被
          # Google 从 SDK 仓库下架（repository2-3.xml 里已查无此包）：action 内部执行 sdkmanager tools
          # 会以「Failed to find package 'tools'」退出码 1 失败，整个 Android job 连 JDK 装完就挂。
          # 这里只装 platform-tools；NDK / CMake / 平台 / build-tools 由下一步按项目所需版本安装。
          packages: 'platform-tools'

      - name: 安装 NDK / CMake / 平台
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      # Chaquopy 17 构建期需要与 android/app/build.gradle.kts 里 version="3.13" 同版本的
      # Python 解释器进 PATH（ubuntu-latest 自带 3.12，Chaquopy 会直接报版本不匹配）。
      - name: 安装 Python 3.13（Chaquopy 构建期依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 构建 APK
        run: |
          cd android
          set +e
          ./gradlew assembleDebug --no-daemon > gradle-ci.log 2>&1
          status=$?
          set -e
          # 失败时把关键报错段逐行转成 ::error:: annotations（公共仓库匿名可读，
          # 便于无 gh/token 环境排障），完整日志另传 artifact
          if [ $status -ne 0 ]; then
            grep -n -A 40 "What went wrong" gradle-ci.log | head -n 60 | sed 's/^/::error::/' || true
            # Kotlin/AGP 具体错误行（e: 前缀）与 AAPT error
            grep -E "^e: |error: |ERROR: " gradle-ci.log | head -n 40 | sed 's/^/::error::/' || true
            echo "### Gradle 构建失败（尾部 250 行）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 250 gradle-ci.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: 上传 gradle 日志（排障用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-ci-log
          path: android/gradle-ci.log
          if-no-files-found: ignore

      - name: 上传 APK（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: waveforge-tv-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ---------- Windows 安装包构建（打 tag / 手动触发） ----------
  windows-build:
    name: Windows 安装包构建
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 下载 Electron 运行时（npm ci 的 allow-scripts 会跳过其安装脚本）
        run: node node_modules/electron/install.js

      - name: 重建嵌入式 Python（用户端无需安装 Python）
        env:
          PIP_INDEX_URL: https://pypi.org/simple
        run: npm run bundle-python
        timeout-minutes: 20

      - name: 运行 stem Python 集成测试
        run: npm run test:stems:python

      - name: 安装 castLabs EVS（Apple Music 生产 VMP）
        run: py -3 -m pip install castlabs-evs==1.3.2

      - name: 构建 Windows 安装包（生产 VMP 必需）
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: "1"
        run: npm run build:electron

      - name: 上传安装包（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: waveforge-windows-installer
          path: release/*.exe
