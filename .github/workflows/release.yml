name: Release

# 打 tag（v0.2.0 等）自动：构建 Android APK → 发布到 Gitee + GitHub Release → 生成并推送 update.json
# 仓库需配置 Secret：GITEE_TOKEN（Gitee 私人令牌，发布 Gitee Release 与推送 update.json 用）
on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout（完整历史，供 update.json 推送到双源）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确保 Gradle Wrapper 可执行
        run: chmod +x android/gradlew

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm install
        run: npm ci

      - name: 拉取 nodejs-mobile 运行时
        run: npm run fetch:nodejs-mobile

      - name: 组装安卓资产（前端 + 后端 bundle + 设备端依赖）
        run: npm run build:android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 同 ci.yml：packages 默认值里的 legacy tools 包已被 Google 下架，会直接让 job 失败
          packages: 'platform-tools'

      - name: 安装 NDK / CMake / 平台
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: 写出 Release keystore（固定签名，保证可覆盖安装）
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        if: env.RELEASE_KEYSTORE_B64 != '' && env.RELEASE_KEYSTORE_PASSWORD != ''
        shell: bash
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/waveforge-release.keystore"
          echo "WAVEFORGE_RELEASE_KEYSTORE=$RUNNER_TEMP/waveforge-release.keystore" >> "$GITHUB_ENV"
          echo "WAVEFORGE_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: 构建 APK（release keystore；未配置 secret 时回退 debug 签名）
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          WAVEFORGE_RELEASE_KEYSTORE: ${{ env.WAVEFORGE_RELEASE_KEYSTORE }}
          WAVEFORGE_RELEASE_KEYSTORE_PASSWORD: ${{ env.WAVEFORGE_RELEASE_KEYSTORE_PASSWORD }}

      - name: 添加 Gitee remote（update.json 推送目标）
        run: git remote add gitee "https://gitee.com/kirito666233/wave-forge.git"

      - name: 写出清单签名私钥
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
        if: env.LICENSE_PRIVATE_KEY != ''
        shell: bash
        run: |
          mkdir -p "$APPDATA/WaveForge License Studio"
          printf '%s\n' "$LICENSE_PRIVATE_KEY" > "$APPDATA/WaveForge License Studio/license-private-key.pem"

      - name: 发布到 Gitee + GitHub，生成并推送 update.json
        run: |
          NOTES=$(git tag -l --format='%(subject)%0a%0a%(body)' "$GITHUB_REF_NAME" | sed 's/^ *//' | sed '/^$/d' | head -20)
          node scripts/publish-release.mjs \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --notes "$NOTES"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
